# 第二阶段（从 soup 20-30k 起训，run_train_s4_4gpu.sh）。clean -> randomized 训练增强（lingbotvla/data/vla_data/random_aug.py），
# 只用 clean 训练数据；未列出的参数取 DEFAULTS。
# 第一版（s2）在纹理+杂物同时出现时崩：机械臂伸向后部真实杂物（clean 只加杂物 76.6、只加纹理小降，两者一起 8 个任务大面积崩）。
# 相对 s2 的改动：去掉 teacher_clean；增强样本 95% 贴干扰物、每画面 3-8 个、桌面后部和腕部也贴、按来源任务均匀抽；去掉白边；纹理压暗、模糊。

prob: 0.5                 # 一半样本保持 clean，保 clean 成功率
# 深度/视频教师看学生同一张增强后画面。s2 让教师看干净画面（teacher_clean，已删除）：学生须从表征里抹掉贴图干扰物，只能靠
# "是否贴图"区分，训练里没被抹掉的物体全是任务物体；真实杂物不是贴图 -> 被当成目标（s2 在纹理+杂物下伸手抓后部杂物）。

mask:
  head_ref: ../../lingbot-vla-v2/assets/random_aug/cam_high_ref.png
  arm_masks: ../../data/random_aug/arm_masks.npy
  arm_dilate_px: 0        # 膨胀出的一圈白桌面在暗纹理上成了白边
  rim_px: 2               # 物体 / 机械臂轮廓上残留的白桌面像素也换纹理（真实画面没有白边）

background:
  prob: 0.98              # 真实只有 2% 保持干净背景
  wrist_prob: 0.8         # 真实腕部基本都是纹理；腕部只靠颜色分背景，再高会更常把白/灰物体（铃、盘、锅）换成纹理（bright_min 0.45 时锅面被换掉，保持默认 0.60）
  texture_dir: ../../data/dtd/dtd/images   # DTD 公开纹理库，不用 RoboTwin 自带随机化纹理
  texture_dir_prob: 0.8
  brightness: [0.15, 0.55]  # 纹理平均亮度，对齐真实 randomized 的暗画面
  blur: [1.0, 3.0]        # 渲染纹理比 DTD 照片平滑（头部 Laplacian：真实 278，未模糊 607，此设置 473）

distractor:
  prob: 0.95
  library: ../../data/random_aug/distractors.npz
  num: [3, 8]
  top_margin: 0.02        # 桌面后部（靠墙）也放
  wrist_prob: 0.6         # 腕部相机也贴（放大 1.5-3.5 倍，立在墙下的桌面上）：s2 只贴头部，腕部初始视角正对后部杂物
  wrist_num: [1, 3]
  task_balance: true      # 按来源任务均匀抽（4 个积木任务占库的 1/4，真实杂物是日用品）

lighting:
  prob: 0.8
  gain: [0.6, 1.1]        # 偏暗（RawVLA：曝光是 VLA 最敏感的成像因素）
  crazy_prob: 0.03

geometry:
  prob: 0.0

instruction:
  prob: 0.5
  paraphrase_file: ../../lingbot-vla-v2/assets/random_aug/instruction_paraphrases.json
