# 第二阶段（从全参 checkpoint 起训）：同 random_aug.yaml，关 geometry、腕部换背景减半、DTD 真实纹理、教师看干净画面。
# clean -> randomized 训练增强（lingbotvla/data/vla_data/random_aug.py），只用 clean 训练数据。
# 训练时加 --data.random_aug_config ../scripts/random_aug/random_aug_s2.yaml 启用；相对路径以本文件所在目录为基准。
# 未列出的参数取 random_aug.py 里的 DEFAULTS。

prob: 0.5                 # 每个样本做图像随机化的概率；其余保持原样 clean，防止 clean 成功率掉
teacher_clean: true       # 深度/视频蒸馏的教师看增强前的画面：学生从随机化画面学干净场景的目标（逐 patch 对齐，geometry 须为 0）

mask:
  head_ref: ../../lingbot-vla-v2/assets/random_aug/cam_high_ref.png   # build_assets.py 生成
  arm_masks: ../../data/random_aug/arm_masks.npy                        # render_arm_masks.py 生成；保护白色机械臂不被换纹理

background:               # 桌面/墙面换纹理（对应 random_background）
  prob: 0.9
  wrist_prob: 0.4         # 第二阶段减半：腕部只靠颜色分背景，贴边的白/灰物体（碗、锅、铃）会被当成桌面换掉纹理
  texture_dir: ../../data/dtd/dtd/images   # DTD 公开纹理库（5640 张），不要用 RoboTwin 自带随机化纹理
  texture_dir_prob: 0.7

distractor:               # 贴其他任务的物体（对应 cluttered_table），只贴头部相机
  prob: 0.7
  library: ../../data/random_aug/distractors.npz                        # build_assets.py 生成
  num: [1, 4]

lighting:                 # 光照（对应 random_light / crazy light）；与 --data.image_augment 叠加
  prob: 0.8
  crazy_prob: 0.03

geometry:                 # 头部相机小幅缩放平移（对应桌面高度 ±3cm）
  prob: 0.0               # 第二阶段关闭：画面平移/缩放而动作不变，会削弱已学会的抓取精度；也会与 teacher_clean 的目标错位

instruction:              # 指令改写（randomized 评测用 unseen 指令）；与图像随机化独立抽样
  prob: 0.5
  paraphrase_file: ../../lingbot-vla-v2/assets/random_aug/instruction_paraphrases.json   # gen_instruction_paraphrases.py 生成
