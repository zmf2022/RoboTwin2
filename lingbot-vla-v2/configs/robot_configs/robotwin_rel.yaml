# robotwin.yaml with relative arm actions: the 6 arm joints of each arm are predicted as action - current state
# (every chunk step relative to the chunk's state); the grippers stay absolute (as openpi's delta-action mask).
states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 6
        - observation.state:
            start: 7
            end: 13

  - observation.state.effector.position: 
      origin_keys:
        - observation.state:
            start: 6
            end: 7
        - observation.state:
            start: 13
            end: 14

actions:
  - action.arm.position: 
      origin_keys:
          - action:
              start: 0
              end: 6
          - action:
              start: 7
              end: 13
      subtract_state: True
      relative_type: joint   # plain action - state (the default quaternion_local is for end.position poses)

  - action.effector.position: 
      origin_keys:
          - action:
              start: 6
              end: 7
          - action:
              start: 13
              end: 14
      subtract_state: False
  
images:
  - observation.images.camera_top: 
      origin_keys:  observation.images.cam_high
  - observation.images.camera_wrist_left: 
      origin_keys: observation.images.cam_left_wrist
  - observation.images.camera_wrist_right: 
      origin_keys: observation.images.cam_right_wrist

norm_stats: assets/norm_stats/robotwin_clean_rel.json
